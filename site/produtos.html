<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Produtos | Mercado Aymoré</title>
  <meta name="description" content="Confira os produtos do Mercado Aymoré em Nova Iguaçu.">
  <meta name="theme-color" content="#e30613">
  <meta property="og:title" content="Produtos | Mercado Aymoré">
  <meta property="og:description" content="Confira os produtos do Mercado Aymoré em Nova Iguaçu.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:#e30613; --red-deep:#b90410; --red-dark:#b90410; --ink:#171717; --muted:#66645f;
      --paper:#fbfaf8; --warm:#f4f0e9; --line:#e5e0d8; --white:#fff; --yellow:#ffd400;
      --shadow:0 20px 45px rgba(30,23,17,.1); --header-h:70px;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
    body { margin:0; overflow-x:hidden; color:var(--ink); background:var(--paper); font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; line-height:1.55; }
    body.menu-open { overflow:hidden; }
    img, svg, iframe { max-width:100%; }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; }
    h1, h2, h3, p { margin-top:0; overflow-wrap:break-word; }
    h1, h2 { font-family:Fraunces,Georgia,serif; letter-spacing:-.035em; line-height:1.06; }
    h1 { max-width:720px; margin-bottom:20px; font-size:clamp(2.1rem,8.5vw,3.2rem); }
    h2 { margin-bottom:16px; font-size:clamp(1.9rem,7.5vw,2.6rem); }
    p { color:var(--muted); }
    .container { width:calc(100% - 32px); max-width:1160px; margin:0 auto; }
    .eyebrow { display:inline-flex; align-items:center; gap:10px; color:var(--red); font-size:.72rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    .eyebrow::before { content:""; width:28px; height:2px; flex:0 0 28px; background:currentColor; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:48px; padding:0 19px; border:1px solid transparent; border-radius:3px; font-weight:700; font-size:.9rem; text-align:center; transition:transform .2s ease, background .2s ease, color .2s ease; }
    .button:hover { transform:translateY(-2px); }
    .button-red { background:var(--red); color:var(--white); }
    .button-red:hover { background:var(--red-deep); }
    .button-light { background:var(--white); color:var(--red); }
    .button-outline { border-color:rgba(255,255,255,.55); color:var(--white); }
    .button-outline:hover { background:var(--white); color:var(--ink); }

    /* ---------- Cabecalho / menu ---------- */
    .nav-wrap { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:var(--header-h); }
    .brand { display:inline-flex; align-items:center; gap:8px; padding:7px 11px 7px 6px; background:var(--red); color:var(--white); font-weight:700; font-size:.95rem; letter-spacing:-.02em; }
    .brand-text em { display:block; color:var(--yellow); font-family:Fraunces,Georgia,serif; font-size:1.15em; font-style:normal; line-height:.85; }
    .brand-mark { display:inline-block; width:36px; height:36px; flex:0 0 36px; background:url("carrinho1-sem-fundo.png") center / contain no-repeat; }
    .nav-links { position:fixed; z-index:19; top:var(--header-h); left:0; right:0; display:flex; flex-direction:column; gap:4px; padding:14px 16px 20px; background:var(--white); color:var(--ink); border-bottom:1px solid var(--line); box-shadow:0 12px 26px rgba(20,15,10,.14); transform:translateY(-130%); opacity:0; visibility:hidden; transition:transform .3s ease, opacity .3s ease, visibility .3s ease; }
    .nav-links.is-open { transform:translateY(0); opacity:1; visibility:visible; }
    .nav-links a { width:100%; padding:13px 12px; border-radius:3px; color:var(--ink); font-size:1rem; font-weight:600; text-align:center; }
    .nav-links a:hover, .nav-links a.active { color:var(--red); background:var(--warm); }
    .menu-toggle { display:flex; align-items:center; justify-content:center; width:44px; height:44px; flex:0 0 44px; padding:0; border:0; background:transparent; color:currentColor; cursor:pointer; }
    .menu-toggle span { position:relative; display:block; width:22px; height:2px; background:currentColor; transition:background .2s ease; }
    .menu-toggle span::before, .menu-toggle span::after { content:""; position:absolute; left:0; display:block; width:22px; height:2px; background:currentColor; transition:transform .25s ease; }
    .menu-toggle span::before { top:-7px; }
    .menu-toggle span::after { top:7px; }
    .menu-toggle[aria-expanded="true"] span { background:transparent; }
    .menu-toggle[aria-expanded="true"] span::before { transform:translateY(7px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"] span::after { transform:translateY(-7px) rotate(-45deg); }

    /* ---------- Botoes flutuantes ---------- */
    .whatsapp-float, .instagram-float { position:fixed; z-index:16; right:14px; display:flex; align-items:center; justify-content:center; gap:9px; padding:13px; border-radius:50%; color:#fff; box-shadow:0 10px 25px rgba(0,0,0,.2); font-size:.8rem; font-weight:700; transition:transform .2s ease; }
    .whatsapp-float { bottom:14px; background:#1caa59; }
    .instagram-float { bottom:74px; background:#c13584; }
    .whatsapp-float:hover, .instagram-float:hover { transform:translateY(-3px); }
    .whatsapp-float span, .instagram-float span { display:none; }
    .social-icon { display:block; width:22px; height:22px; flex:0 0 22px; fill:currentColor; shape-rendering:geometricPrecision; }
    :focus-visible { outline:3px solid var(--yellow); outline-offset:3px; }

    @media (min-width:600px) {
      .whatsapp-float, .instagram-float { right:22px; padding:12px 17px; border-radius:3px; font-size:.82rem; }
      .whatsapp-float { bottom:22px; }
      .instagram-float { bottom:76px; }
      .whatsapp-float span, .instagram-float span { display:inline; }
      .social-icon { width:24px; height:24px; flex:0 0 24px; }
    }

    @media (min-width:769px) {
      :root { --header-h:78px; }
      .container { width:calc(100% - 40px); }
      h1 { margin-bottom:22px; font-size:clamp(3rem,6vw,5.4rem); }
      h2 { margin-bottom:18px; font-size:clamp(2.35rem,4.6vw,4rem); }
      .brand { gap:9px; padding:8px 12px 8px 6px; font-size:1.05rem; }
      .brand-mark { width:42px; height:42px; flex:0 0 42px; }
      .nav-links { position:static; flex-direction:row; align-items:center; gap:25px; width:auto; padding:0; background:transparent; border:0; box-shadow:none; transform:none; opacity:1; visibility:visible; color:inherit; font-size:.88rem; font-weight:600; }
      .nav-links a { width:auto; padding:0; border-radius:0; color:inherit; font-size:.88rem; }
      .nav-links a:hover, .nav-links a.active { background:transparent; color:var(--red); }
      .menu-toggle { display:none; }
    }

    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior:auto; }
      * { transition-duration:.01ms !important; animation-duration:.01ms !important; }
    }

    .site-header { position:relative; z-index:20; background:var(--white); border-bottom:1px solid var(--line); box-shadow:0 4px 20px rgba(20,15,10,.08); }
    .page-hero { padding:56px 0 48px; background:var(--warm); }
    .page-hero p { max-width:52ch; margin:18px 0 0; font-size:1rem; }
    footer { padding:26px 0; background:#171717; color:#aaa; font-size:.82rem; }
    .footer-row { display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
    .footer-row a { color:#fff; font-weight:700; }
    @media (min-width:769px) {
      .page-hero { padding:100px 0 85px; }
      .page-hero p { margin:22px 0 0; font-size:1.05rem; }
      footer { padding:30px 0; }
      .footer-row { flex-direction:row; align-items:center; justify-content:space-between; gap:20px; text-align:left; }
    }
    .content { padding:40px 0 70px; }
    .catalog-tabs { display:flex; gap:8px; margin-bottom:24px; padding-bottom:8px; border-bottom:1px solid var(--line); overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    .catalog-tabs::-webkit-scrollbar { display:none; }
    .catalog-tab { flex:0 0 auto; padding:8px 12px; border:0; border-bottom:2px solid transparent; background:transparent; color:var(--muted); font-size:.85rem; font-weight:700; white-space:nowrap; cursor:pointer; }
    .catalog-tab.active, .catalog-tab:hover { border-color:var(--red); color:var(--red); }
    @media (min-width:769px) {
      .content { padding:70px 0 110px; }
      .catalog-tabs { gap:24px; margin-bottom:30px; padding-bottom:14px; }
      .catalog-tab { padding:8px 0; font-size:.9rem; }
    }
  </style>
</head>
<body>

  <script>
    (function () {
      var toggle = document.getElementById('menu-toggle');
      var nav = document.getElementById('nav-links');
      if (!toggle || !nav) return;
      var close = function () {
        nav.classList.remove('is-open');
        document.body.classList.remove('menu-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Abrir menu');
      };
      toggle.addEventListener('click', function () {
        var open = nav.classList.toggle('is-open');
        document.body.classList.toggle('menu-open', open);
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
      });
      nav.querySelectorAll('a').forEach(function (link) { link.addEventListener('click', close); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
      window.addEventListener('resize', function () { if (window.innerWidth > 768) close(); });
    })();
  </script>
